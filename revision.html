uts (Salidas Cl. 9.3.3) <span class="cnt" id="outCnt"></span></div><div class="io-grid" id="outputs"></div></div><div class="sect"><div class="sect-hdr">✅ Acuerdos <span class="cnt" id="acCnt"></span></div><div id="acuerdos"></div></div></div><script>var D={"rd":{"folio":"RD-2026-02","fecha_programada":"2026-09-28","fecha_ejecucion":"","lugar":"Av. Paseo de la Reforma #505, piso 43 · Sesión híbrida (Teams)","estado":"En preparación","convocante":"José Luis Rodríguez — Director de Operaciones / Representante de la Alta Dirección","asistentes":["José Luis Rodríguez — Director de Operaciones / Representante de la Alta Dirección","Mizraim Alcázar — Auditor Líder del SGI","Adanely Vázquez — Auditor interno"],"inputs":{"acuerdos_previos":{"texto":"Se da seguimiento a los acuerdos de la revisión RD-2026-01. Los 23 hallazgos del ciclo 2025 fueron cerrados y verificados en su eficacia.","evidencia":"Minuta RD-2026-01 · Registro de hallazgos ciclo 2025","listo":true},"contexto_externo":{"texto":"Entorno de servicios gestionados con exigencia creciente en niveles de servicio y protección de la información. Requisitos regulatorios y contractuales de clientes en materia de privacidad y ciberseguridad. Auditoría de vigilancia COMPECER programada del 7 al 9 de septiembre de 2026 (fecha reprogramada desde agosto).","evidencia":"Política BPM-PO-01 v01 · Programa de auditoría 2026","listo":true},"contexto_interno":{"texto":"Cambio en la estructura del SGI: baja de Adriana Reyes y transición de la responsabilidad del SGC a América Alcázar (CH-2026-11). Consolidación de las tres políticas en una Política Integral única (BPM-PO-01 v01). Ampliación de la matriz de riesgos de 28 a 98 registros.","evidencia":"Registro de cambios del SGI · Documento de roles y responsabilidades","listo":true},"partes_interesadas":{"texto":"Clientes, personal, proveedores, accionistas y autoridades. Se identifica como brecha la ausencia de un mecanismo formal de seguimiento y revisión periódica de la informa 6.","evidencia":"Registro de hallazgos ciclo 2026 · Portal SGI","listo":true},"auditoria_interna":{"texto":"Ciclo AI-SGI-02-2026 ejecutado del 13 al 24 de julio de 2026, con cobertura del 100% del alcance del SGI en 14 áreas. Auditor Líder: América Alcázar. Equipo de 9 auditores y 1 en formación. Nivel de confianza del proceso: alto.","evidencia":"Informe de auditoría BPM-FO-18","listo":true},"proveedores":{"texto":"Se identifica como NC mayor la ausencia de evaluación de proveedores desde la perspectiva de seguridad de la información y tratamiento de riesgos de terceros (Cl. 8.4 / controles 5.19–5.23).","evidencia":"Hallazgo INT-2026-NCM-09","listo":true},"sla_desempenio":{"texto":"Objetivos 2026 del NOC: disponibilidad de servicios críticos ≥99.5% y cumplimiento de SLA ≥95% al cierre del segundo semestre. Meta del primer semestre: ≥99.0%.","evidencia":"BPM-FO-19 Objetivos SGI 2026","listo":true},"incidentes_cambios":{"texto":"Se identifica la ausencia de un proceso formal de gestión de problemas diferenciado de incidentes, sin base de errores conocidos (NC mayor de Cl. 8.6.3). La gestión de cambios de TI opera conforme a BPM-PR-02.","evidencia":"Hallazgos INT-2026-NCM-14 · BPM-PR-02","listo":true},"capacidad_disponibilidad":{"texto":"No se evidenciaron planes de continuidad del servicio para SOC y NOC ni un programa de pruebas periódicas (NC mayores de Cl. 8.7.2). Acción crítica previa a la vigilancia.","evidencia":"Hallazgos INT-2026-NCM-15 y NCM-16","listo":true},"riesgos_sgsi":{"texto":"NC mayor por ausencia de un proceso formal de apreciación de riesgos de seguridad de la información a intervalos planificados (Cl. 6.1.2 y 8.2). La metodología debe documentarse, aprobarse y ejecutarse antes de la vigilancia.","evidencia":"Hallazgo INT-2026-NCM-10","listo":true},"soa_controles":{"texto":"93 controles del Anexo A de ISO/IEC 27001:2022 en la Declaración de Aplicabilidad. Exclusiones vigentes: 8.25, 8.27, 8.28, 8.29 y 8.30 (desarrollo seguro). 47 riesgos de la matriz tienen control del SoA vinculado.","evidencia":"SoA vigente · Matriz de riesgos 2026","listo":true},"amenazas":{"texto":"Se identifica la necesidad de fortalecer la capacidad de detección del SOC ampliando la cobertura de casos de uso alineados a MITRE ATT&CK (objetivo 6 del SGI 2026).","evidencia":"BPM-FO-19 Objetivo 6","listo":true}},"outputs":{"mejoras_oportunidades":{"texto":"Priorizar el cierre de las 16 NC mayores antes del 4 de septiembre de 2026, con foco en los cuatro bloques críticos: aprobación formal de la política y del documento de roles, formalización de la gestión de riesgos de SI, planes de continuidad del servicio, y gestión de problemas.","evidencia":"Plan de acción consolidado del ciclo 2026","listo":true},"cambios_sgi":{"texto":"Se aprueban: (1) la transición de la responsabilidad del SGC a América Alcázar; (2) la Política Integral BPM-PO-01 v01 sustituyendo las tres políticas previas; (3) la matriz de riesgos ampliada con migración de controles a ISO 27001:2022. Se declara el control preventivo de independencia de auditoría: el bloque ISO 9001 del programa 2027 será liderado por Mizraim Alcázar conforme a ISO 19011 Cl. 5.5.2 e ISO 9001 Cl. 9.2.2 c).","evidencia":"Registro de cambios del SGI · CH-2026-11, CH-2026-12 y CH-2026-13","listo":true},"recursos_necesarios":{"texto":"Asignación de tiempo de los líderes de SOC, NOC, People & Culture y Procura para la ejecución de los planes de acción. Recursos para la elaboración del análisis de impacto al negocio (BIA) y las pruebas de continuidad.","evidencia":"Planes de acción de las NC mayores","listo":true}},"acuerdos":[{"acuerdo":"Recabar la aprobación formal de la Alta Dirección de la Política Integral BPM-PO-01 v01 y publicarla con evidencia de aprobación.","responsable":"José Luis Rodríguez / Mizraim Alcázar","fecha_compromiso":"2026-09-04","estado":"Abierto"},{"acuerdo":"Aprobar el documento de roles y responsabilidades del SGI incorporando la transición del SGC a América Alcázar.","responsab
