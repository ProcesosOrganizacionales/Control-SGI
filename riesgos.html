x 6px;border-radius:10px;margin-left:4px;font-size:10px;font-weight:700}.fbtn.active .cnt{background:rgba(255,255,255,.25)}.search{padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;min-width:200px;background:#fff}.lista{display:flex;flex-direction:column;gap:10px}.r-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;border-left:4px solid var(--border)}.r-card.crit{border-left-color:var(--crit)}.r-card.alto{border-left-color:var(--red)}.r-card.mod{border-left-color:var(--amber)}.r-card.tol{border-left-color:var(--blue)}.r-card.bajo{border-left-color:var(--green)}.r-head{padding:10px 14px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center}.r-head:hover{background:#FAFBFD}.r-cod{font-family:"DM Mono",monospace;font-size:10px;font-weight:700;color:var(--text);background:#F0F3F8;padding:3px 7px;border-radius:4px;white-space:nowrap}.r-tit{font-size:12px;font-weight:700;color:var(--text);line-height:1.4}.r-meta{font-size:10px;color:var(--muted);margin-top:3px;font-family:"DM Mono",monospace}.r-nivel{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:800;white-space:nowrap;font-family:"DM Mono",monospace}.r-nivel.crit{background:var(--crit);color:#fff}.r-nivel.alto{background:var(--red);color:#fff}.r-nivel.mod{background:#FEF3C7;color:#92400E}.r-nivel.tol{background:#DBEAFE;color:var(--blue)}.r-nivel.bajo{background:#DCFCE7;color:var(--green)}.r-toggle{font-size:14px;color:var(--muted);transition:transform .15s}.r-card.open .r-toggle{transform:rotate(180deg)}.r-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}.r-card.open .r-body{display:block}.r-sect{margin-top:14px}.r-sect-tit{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}.r-sect-tit::before{content:"";width:3px;height:14px;background:var(--blue) ton><button class="fbtn" data-fn="3. Moderado">Moderados<span class="cnt" id="cM">0</span></button><button class="fbtn" data-fn="2. Tolerable">Tolerables<span class="cnt" id="cTo">0</span></button><button class="fbtn" data-fn="1. Bajo">Bajos<span class="cnt" id="cB">0</span></button><input type="text" class="search" id="srch" placeholder="🔍 Buscar..."></div><div class="lista" id="lista"></div><script>var R=[{"id":0,"clave":"R-SGSI-01","sg":"SGSI","sg_label":"SGSI · ISO 27001","en_alcance":true,"tipo":"Riesgo","activo":"Contraseñas débiles","descripcion":"Uso de contraseñas débiles o reutilizadas que permiten accesos no autorizados a consolas administrativas, SIEM, firewalls, servidores o herramientas del SOC/NOC.","clasificacion":"Seguridad de la información","causa":"Políticas de contraseñas obsoletas, MFA no obligatorio, cuentas heredadas, no rotación y falta de controles centralizados de identidad.","efecto":"Acceso no autorizado a infraestructura crítica, alteración de configuraciones, manipulación de alertas, evasión de monitoreo, pérdida de trazabilidad y riesgo de intrusión mayor.","confidencialidad":4,"integridad":3,"disponibilidad":1,"suma_cia":8,"impacto":2.8,"probabilidad":4,"resultado":11.2,"nivel":"3. Moderado","respuesta":"Reducir o mitigar","acciones":"Implementar políticas robustas de contraseñas + MFA obligatorio. Forzar rotación automática","control_2013":"A.9.3.1","control_soa":"5.17","control_nombre":"Información de autenticación","control_origen":"Migrado 2013→2022","control_iso":"A.5.17","naturaleza_control":"Preventivo","estatus":"Sistematizada","comentarios":"","fecha_revision":"2025-11-19","fecha_compromiso":"2026-03-23","responsable":"Hugo Padilla","area":"Security Operation Center","origen_riesgo":"Operativo / Proceso","proceso_20000":"","funciona":""},{"id":1,"clave":"R-SGSI-02","sg":"SGSI","sg_label":"SGSI · ISO 27001","en_alcance":true,"tipo":"Riesgo","activo":"Seguridad en redes internas","descripcion":"Controles y procesos para proteger la LAN/VLAN, switches, routers, Wi‑Fi y movimiento lateral.","clasificacion":"Seguridad de la información","causa":"Configuraciones erróneas, falta de segmentación, dispositivos sin parches, controles de acceso débiles.","efecto":"Exfiltración de datos, manipulación de telemetría y pérdida de conectividad/servicios.","confidencialidad":4,"integridad":4,"disponibilidad":5,"suma_cia":13,"impacto":4.3,"probabilidad":4,"resultado":17.2,"nivel":"4. Crítico","respuesta":"Reducir o mitigar","acciones":"Implementar microsegmentación  y gestión de accesos privilegiados","control_2013":"A.13.1.1","control_soa":"8.20","control_nombre":"Seguridad de las redes","control_origen":"Migrado 2013→2022","control_iso":"A.8.20","naturaleza_control":"Preventivo","estatus":"Sistematizada","comentarios":"Priorizar controles de cuentas privilegiadas, registro (logging) y MFA.","fecha_revision":"2025-11-19","fecha_compromiso":"2026-03-30","responsable":"Hugo Padilla","area":"Security Operation Center","origen_riesgo":"Operativo / Proceso","proceso_20000":"","funciona":""},{"id":2,"clave":"R-SGSI-03","sg":"SGSI","sg_label":"SGSI · ISO 27001","en_alcance":true,"tipo":"Riesgo","activo":"Gestión de accesos a sistemas","descripcion":"Controlar y otorgar permisos de usuarios y cuentas privilegiadas en sistemas del NOC/SOC.","clasificacion":"Seguridad de la información","causa":"Accesos mal definidos, provisión/revocación tardía, falta de roles y controles.","efecto":"Acceso no autorizado, fuga de información, cambios indebidos o interrupciones por errores.","confidencialidad":4,"integridad":3,"disponibilidad":3,"suma_cia":10,"impacto":3.4,"probabilidad":4,"resultado":13.6,"nivel":"3. Moderado","respuesta":"Reducir o mitigar","acciones":"Implementar un sistema de gestión de identidades o accesos para garantizar control centralizado de cuentas","control_2013":"A.9.2.1","control_soa":"5.16","control_nombre":"Gestión de la identidad","control_origen":"Migrado 2013→2022","control_iso":"A.5.16","naturaleza_control":"Preventivo","estatus":"Automatizada","comentarios":"Priorizar controles de cuentas privilegiadas, registro (logging) y MFA desde el inicio; planificar roles y procesos de revocación.","fecha_revision":"2025-11-19","fecha_compromiso":"2026-04-06","responsable":"Hugo Padilla","area":"Security Operation Center","origen_riesgo":"Operativo / Proceso","proceso_20000":"","funciona":""},{"id":3,"clave":"R-GGS-04","sg":"GGS","sg_label":"SGS · ISO 20000-1","en_alcance":true,"tipo":"Riesgo","activo":"Gestión de solicitudes","descripcion":"Proceso para recibir, validar, aprobar y ejecutar solicitudes de acceso, cambios o servicios en el NOC/SOC, sin criterios estandarizados, lo que puede generar errores, retrasos o aprobaciones incorrectas.","clasificacion":"Operativo","causa":"Falta de flujos definidos, ausencia de herramienta de tickets completa y aprobaciones manuales inconsistentes.","efecto":"Retrasos, errores en aprovisionamiento, accesos indebidos o tareas no registradas.","confidencialidad":3,"integridad":3,"disponibilidad":4,"suma_cia":10,"impacto":3.3,"probabilidad":4,"resultado":13.2,"nivel":"3. Moderado","respuesta":"Reducir o mitigar","acciones":"Falta de un proceso estandarizado para recibir, validar, aprobar y ejecutar solicitudes de acceso/cambios/servicios.","control_2013":"","control_soa":"","control_nombre":"","control_origen":"No aplica","control_iso":"","naturaleza_control":"Correctivo","estatus":"Sistematizada","comentarios":"Sistematizada (con pasos de automatización progresiva)","fecha_revision":"2026-01-19","fecha_compromiso":"Pendiente por dependencia de sistema de solicitudes","responsable":"Hugo Padilla","area":"Security Operation Center","origen_riesgo":"Operativo / Proceso","proceso_20000":"Cl. 8.1 — Planificación y control operacional","funciona":""},{"id":4,"clave":"R-SGI-05","sg":"SGI","sg_label":"SGI · Integral","en_alcance":true,"tipo":"Riesgo","activo":"Capacitación del personal","descripcion":"Baja competencia técnica","clasificacion":"Calidad","causa":"Falta de formación formal, alta rotación y ausencia de materiales y ejercicios prácticos.","efecto":"Errores operativos, respuesta lenta a incidentes, manejo inadecuado de credenciales y no cumplimiento de procedimientos.","confidencialidad":3,"integridad":3,"disponibilidad":4,"suma_cia":10,"impacto":3.3,"probabilidad":4,"resultado":13.2,"nivel":"3. Moderado","respuesta":"Reducir o mitigar","acciones":"Implementar programa de capacitación","control_2013":"","control_soa":"","control_nombre":"","control_origen":"No aplica","control_iso":"","naturaleza_control":"Preventivo","estatus":"Sistematizada","comentarios":"La capacitación es una oportunidad de alto impacto y relativamente fácil de ejecutar; además de mitigar riesgos mejora eficiencia y respuesta operativa, por lo que conviene invertir para obtener beneficios sostenibles. Implementación : Sistematizada - Usar  cursos, seguimiento y métricas (automatizable) combinado con sesiones prácticas presenciales/virtuales; así se asegura cumplimiento, trazabilidad y repetibilidad.","fecha_revision":"2025-11-19","fecha_compromiso":"Pendiente por dependencia de validar si el programa es interno o proporcionado por la empresa","responsable":"Hugo Padilla","area":"Security Operation Center","origen_riesgo":"Contexto Interno (Cl. 4.1)","proceso_20000":"","funciona":""},{"id":5,"clave":"R-GGS-06","sg":"GGS","sg_label":"SGS · ISO 20000-1","en_alcance":true,"tipo":"Riesgo","activo":"Disponibilidad de servicios","descripcion":"Interrupciones recurrentes del servicio por fallas técnicas o falta de redundancia.","clasificacion":"Tecnológico","causa":"Falta de redundancia o  procedimientos de recuperación incompletos.","efecto":"Interrupciones de servicio, impacto en clientes/operaciones y pérdida de confianza.","confidencialidad":2,"integridad":3,"disponibilidad":5,"suma_cia":10,"impacto":3.2,"probabilidad":4,"resultado":12.8,"nivel":"3. Moderado","respuesta":"Reducir o mitigar","acciones":"Definir requerimientos de disponibilidad del servicio (objetivos, criticidad y tiempos). Asegurar esquema de alta disponibilidad a nivel servicio y coordinación de componentes (energía, conectividad y herramientas críticas). Validar mediante pruebas periódicas y monitoreo continuo.","control_2013":"","control_soa":"","control_nombre":"","control_origen":"No aplica","control_iso":"","naturaleza_control":"Preventivo","estatus":"Sistematizada","comentarios":"Requiere herramientas  y procesos estandarizados; incluir automatización progresiva para reducir tiempo de respuesta.","fecha_revision":"2026-01-19","fecha_compromiso":"Pendiente por dependencias","responsable":"Hugo Padilla","area":"Security Operation Center","origen_riesgo":"Contexto Interno (Cl. 4.1)","proceso_20000":"Cl. 8.1 — Planificación y control operacional","funciona":""},{"id":6,"clave":"R-SGSI-07","sg":"SGSI","sg_label":"SGSI · ISO 27001","en_alcance":true,"tipo":"Riesgo","activo":"Acceso remoto","descripcion":"Accesos remotos sin controles de seguridad adecuados","clasificacion":"Seguridad de la información","causa":"Credenciales comprometidas, endpoints sin correcta postura de seguridad, configuraciones incorrectas, privilegios excesivos, falta de monitoreo.","efecto":"Exfiltración  de datos, modificaciones no autorizadas, persistencia de atacante, interrupción de servicios.","confidencialidad":4,"integridad":4,"disponibilidad":3,"suma_cia":11,"impacto":3.7,"probabilidad":5,"resultado":18.5,"nivel":"4. Crítico","respuesta":"Reducir o mitigar","acciones":"Implementar acceso remoto seguro a los sistemas y plataformas del SGSI mediante VPN con MFA y validación de postura del dispositivo. Restringir y revisar periódicamente los privilegios de acceso remoto. Establecer monitoreo continuo a través de registros de autenticación y alertas por intentos de acceso o inicios de sesión anómalos.","control_2013":"A.13.2.1","control_soa":"5.14","control_nombre":"Transferencia de información","control_origen":"Migrado 2013→2022","control_iso":"A.5.14","naturaleza_control":"Preventivo","estatus":"Sistematizada","comentarios":"Implementar MFA, posture check, VPN Zero-Trust y revisar privilegios de acceso remoto. Automatizar alertas de inicio de sesión sospechoso.","fecha_revision":"2026-01-19","fecha_compromiso":"2026-04-30","responsable":"Hugo Padilla","area":"Security Operation Center","origen_riesgo":"Operativo / Proceso","proceso_20000":"","funciona":""},{"id":7,"clave":"R-SGSI-08","sg":"SGSI","sg_label":"SGSI · ISO 27001","en_alcance":true,"tipo":"Riesgo","activo":"Errores humanos en respuesta a incidentes","descripcion":"Decisiones incorrectas ante eventos red / seguridad","clasificacion":"Riesgo operacional / humano.","causa":"Falta de capacitación, ausencia de playbooks/estándares, fatiga, presión, herramientas inmaduras o interfaces confusas.","efecto":"Respuestas incorrectas que agravan el incidente, interrupciones de servicio, pérdida/modificación de evidencias, exposición de datos.","confidencialidad":3,"integridad":3,"disponibilidad":4,"suma_cia":10,"impacto":3.3,"probabilidad":5,"resultado":16.5,"nivel":"4. Crítico","respuesta":"Reducir o mitigar","acciones":"Crear y mantener playbooks, runbooks y checklists de respuesta a incidentes, así como formación obligatoria para el personal involucrado. Establecer un proceso de revisión y actualización periódica de estos documentos con base en cambios operativos y lecciones aprendidas de incidentes.","control_2013":"A.16.1.5","control_soa":"5.26","control_nombre":"Respuesta a incidentes de seguridad de la información","control_origen":"Migrado 2013→2022","control_iso":"A.5.26","naturaleza_control":"Preventivo","estatus":"Sistematizada","comentarios":"Establecer procesos, runbooks, checklists y procedimientos estandarizados,  automatizar partes (p. ej. respuestas repetitivas) vendrá después, pero la base debe ser sistematización para consistencia y trazabilidad.","fecha_revision":"2026-01-19","fecha_compromiso":"Pendiente por validación
