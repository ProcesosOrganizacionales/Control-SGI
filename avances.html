<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resumen de Hallazgos</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#F4F6FA;--card:#FFF;--border:#E2E8F2;--text:#1A2B42;--muted:#7A8CA0}body{font-family:"DM Sans",-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:12px;min-height:100vh;font-size:12px}.resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}@media(max-width:800px){.resumen{grid-template-columns:repeat(2,1fr)}}.rcard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 8px;text-align:center}.rnum{font-size:24px;font-weight:800;line-height:1;font-family:"DM Mono",monospace}.rlbl{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-top:4px}.rpct{font-size:10px;color:#9CAABC;margin-top:2px;font-family:"DM Mono",monospace}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}@media(max-width:700px){.kpis{grid-template-columns:1fr}}.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px}.kpi-n{font-size:20px;font-weight:800;color:var(--text);font-family:"DM Mono",monospace}.kpi-l{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}.comp{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:12px}.comp-t{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.comp-bar{display:flex;height:22px;border-radius:5px;overflow:hidden}.comp-bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:800;font-family:"DM Mono",monospace}.comp-leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:var(--muted)}.comp-leg span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:2px}.tabla{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}.row{display:grid;grid-template-columns:190px 1fr 44px 300px;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid #F0F3F8}.row:last-child{border-bottom:none}@media(max-width:900px){.row{grid-template-columns:1fr;gap:6px}}.anom{font-size:12px;font-weight:700}.asub{font-size:9px;color:var(--muted);margin-top:2px;font-family:"DM Mono",monospace}.barwrap{background:#F0F3F8;border-radius:6px;height:22px;overflow:hidden}.bar{display:flex;height:100%;border-radius:6px;overflow:hidden}.tot{font-size:16px;font-weight:800;font-family:"DM Mono",monospace;text-align:right}.chips{display:flex;gap:5px;flex-wrap:wrap;font-size:10px}.chip{padding:3px 7px;border-radius:4px;font-family:"DM Mono",monospace;font-weight:700;white-space:nowrap}.chip.na{background:#F8F9FB;color:#C3CDD8;font-style:italic;font-weight:500}</style></head><body><div class="resumen" id="resumen"></div><div class="kpis" id="kpis"></div><div class="comp"><div class="comp-t">Composición de los hallazgos</div><div class="comp-bar" id="cbar"></div><div class="comp-leg" id="cleg"></div></div><div class="tabla" id="tabla"></div><script>var D={"areas":[{"area":"SOC","total":13,"cerrados":0,"NC mayor":4,"NC menor":4,"Observación":2,"Oportunidad de mejora":3},{"area":"NOC","total":13,"cerrados":0,"NC mayor":3,"NC menor":5,"Observación":1,"Oportunidad de mejora":4},{"area":"Certificaciones ISO","total":8,"cerrados":0,"NC mayor":5,"NC menor":2,"Observación":1,"Oportunidad de mejora":0},{"area":"People & Culture","total":6,"cerrados":0,"NC mayor":3,"NC menor":3,"Observación":0,"Oportunidad de mejora":0},{"area":"Gestión de la Procura","total":4,"cerrados":0,"NC mayor":1,"NC menor":3,"Observación":0,"Oportunidad de mejora":0},{"area":"PMO","total":3,"cerrados":0,"NC mayor":0,"NC menor":1,"Observación":0,"Oportunidad de mejora":2},{"area":"Tecnologías de la Información","total":1,"cerrados":0,"NC mayor":0,"NC menor":1,"Observación":0,"Oportunidad de mejora":0},{"area":"Pre Ventas","total":1,"cerrados":0,"NC mayor":0,"NC menor":0,"Observación":0,"Oportunidad de mejora":1},{"area":"Ventas","total":1,"cerrados":0,"NC mayor":0,"NC menor":0,"Observación":1,"Oportunidad de mejora":0},{"area":"Gestión Legal","total":1,"cerrados":0,"NC mayor":0,"NC menor":1,"Observación":0,"Oportunidad de mejora":0},{"area":"CSM","total":1,"cerrados":0,"NC mayor":0,"NC menor":0,"Observación":0,"Oportunidad de mejora":1},{"area":"Logistics","total":1,"cerrados":0,"NC mayor":0,"NC menor":0,"Observación":1,"Oportunidad de mejora":0}],"tot":{"total":53,"cerrados":0,"NC mayor":16,"NC menor":20,"Observación":6,"Oportunidad de mejora":11,"areas":12,"ncTotal":36,"pctMejora":32},"ciclo":"2026","tipos":[{"k":"NC mayor","lbl":"NC mayor","color":"#B52020","bg":"#FDEAEA"},{"k":"NC menor","lbl":"NC menor","color":"#D97706","bg":"#FEF3C7"},{"k":"Observación","lbl":"Observación","color":"#B5751C","bg":"#FDF3D8"},{"k":"Oportunidad de mejora","lbl":"Oport. mejora","color":"#0067B1","bg":"#EBF4FD"}]};function init(){var t=D.tot,T=D.tipos;document.getElementById("resumen").innerHTML=T.map(function(x){var n=t[x.k],p=t.total?Math.round(n/t.total*100):0;return '<div class="rcard" style="border-left:4px solid '+x.color+'"><div class="rnum" style="color:'+x.color+'">'+n+'</div><div class="rlbl">'+x.lbl+'</div><div class="rpct">'+p+'% del total</div></div>'}).join("");var conH=D.areas.filter(function(a){return a.total>0}).length;document.getElementById("kpis").innerHTML='<div class="kpi"><div class="kpi-n">'+conH+' de '+t.areas+'</div><div class="kpi-l">áreas con hallazgos en el ciclo '+D.ciclo+'</div></div>'+'<div class="kpi"><div class="kpi-n">'+t.pctMejora+'%'+'</div><div class="kpi-l">son observaciones y oportunidades de mejora</div></div>'+'<div class="kpi"><div class="kpi-n">'+t.total+'</div><div class="kpi-l">hallazgos totales · '+t.ncTotal+' no conformidades</div></div>';document.getElementById("cbar").innerHTML=T.filter(function(x){return t[x.k]>0}).map(function(x){var p=t[x.k]/t.total*100;return '<div style="width:'+p+'%;background:'+x.color+'">'+Math.round(p)+'%</div>'}).join("");document.getElementById("cleg").innerHTML=T.map(function(x){return '<span><i class="dot" style="background:'+x.color+'"></i>'+x.lbl+'</span>'}).join("");var max=D.areas.length?D.areas[0].total:1;document.getElementById("tabla").innerHTML=D.areas.map(function(a){var seg=T.filter(function(x){return a[x.k]>0}).map(function(x){return '<div style="width:'+(a[x.k]/a.total*100)+'%;background:'+x.color+'" title="'+x.lbl+'"></div>'}).join("");var ch=T.map(function(x){return a[x.k]>0?'<span class="chip" style="background:'+x.bg+';color:'+x.color+'">'+x.lbl+' '+a[x.k]+'</span>':'<span class="chip na">'+x.lbl+' 0</span>'}).join("");var w=Math.max(a.total/max*100,6);return '<div class="row"><div><div class="anom">'+a.area+'</div><div class="asub">'+a.cerrados+' de '+a.total+' cerrados</div></div><div class="barwrap"><div class="bar" style="width:'+w+'%">'+seg+'</div></div><div class="tot">'+a.total+'</div><div class="chips">'+ch+'</div></div>'}).join("");}init();</script></body></html>
