<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Política, Alcance y Objetivos · SGI NTT DATA</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#F4F6FA;--card:#FFF;--border:#E2E8F2;--text:#1A2B42;--muted:#7A8CA0;--blue:#0067B1;--green:#0A7A5A;--red:#B52020;--amber:#B5751C}body{font-family:"DM Sans",-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:12px;min-height:100vh;font-size:12px}.wrap{margin:0}.hdr{text-align:center;margin-bottom:18px}.hdr-tit{font-size:20px;font-weight:800;color:var(--text)}.hdr-sub{font-size:11px;color:var(--muted);margin-top:4px;font-family:"DM Mono",monospace}.pol{background:#fff;border:1px solid var(--border);border-radius:12px;padding:0;margin-bottom:14px;overflow:hidden}.pol-hdr{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}.pol-icono{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;color:#fff}.pol-info{flex:1}.pol-norma{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.pol-tit{font-size:14px;font-weight:800;color:var(--text);margin-top:2px}.pol-body{padding:12px 16px}.pol-txt{font-size:12px;color:#556270;line-height:1.7;white-space:pre-wrap}.pol-comp{margin-top:14px;padding:12px 16px;background:#FAFBFD;border-radius:8px;border-left:3px solid currentColor}.pol-comp-tit{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}.pol-comp ul{margin:0;padding-left:18px;font-size:12px;color:#556270;line-height:1.7}.pol-alc{margin-top:14px;padding:14px 16px;background:#FAFBFD;border-radius:8px;border:1px solid var(--border)}.pol-alc-tit{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:currentColor;margin-bottom:6px}.pol-alc-tit::before{content:"📍 ";font-size:11px}.pol-alc-desc{font-size:12px;color:#556270;line-height:1.6;margin-bottom:8px}.pol-alc-row{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#556270;margin-top:4px}.pol-alc-row b{color:var(--text)}.obj{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px}.obj-hdr{font-size:14px;font-weight:800;color:var(--text);margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--blue);display:flex;align-items:center;gap:8px}.obj-grid{display:grid;grid-template-columns:1fr;gap:10px}.obj-card{padding:14px 16px;background:#FAFBFD;border:1px solid var(--border);border-radius:8px;border-left:4px solid var(--blue)}.obj-card.iso9001{border-left-color:var(--blue)}.obj-card.iso27001{border-left-color:var(--red)}.obj-card.iso20000{border-left-color:var(--green)}.obj-head{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.obj-num{font-family:"DM Mono",monospace;font-size:11px;font-weight:800;background:var(--text);color:#fff;padding:2px 8px;border-radius:4px}.obj-norma{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:4px}.obj-norma.iso9001{background:#DBEAFE;color:var(--blue)}.obj-norma.iso27001{background:#FDEAEA;color:var(--red)}.obj-norma.iso20000{background:#DCFCE7;color:var(--green)}.obj-tit{font-size:13px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:8px}.obj-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}@media(max-width:600px){.obj-grid2{grid-template-columns:1fr}}.obj-cell{font-size:11px;color:#556270;line-height:1.5}.obj-cell-lbl{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.foot{text-align:center;font-size:10px;color:var(--muted);margin-top:18px;padding-top:12px;border-top:1px solid var(--border)}</style></head><body><div class="wrap"><div id="politicas"></div><div class="obj"><div class="obj-hdr">🎯 Objetivos del SGI <span id="objCnt" style="margin-left:auto;font-size:11px;color:#7A8CA0;font-weight:600;font-family:'DM Mono',monospace"></span></div><div class="obj-grid" id="objetivos"></div></div></div><script>var D={"politicas":[{"norma":"ISO 9001:2015 · ISO/IEC 20000-1:2018 · ISO/IEC 27001:2022","titulo":"Política Integral del SGI · BPM-PO-01 v01","icono":"📋","color":"#0067B1","texto":"NTT DATA México, empresa dedicada a la prestación de servicios de tecnologías de la información y servicios gestionados, opera en un entorno dinámico y altamente exigente en materia de calidad, niveles de servicio y protección de la información. En respuesta a este contexto y a las necesidades de sus partes interesadas, establece la presente política como marco de actuación y compromiso de la Alta Dirección, integrando de forma coherente los requisitos de las normas ISO 9001:2015, ISO/IEC 20000-1:2018 e ISO/IEC 27001:2022 en un único Sistema de Gestión Integral (SGI) orientado a la satisfacción de las partes interesadas y a la mejora continua.\n\nLa Alta Dirección declara su compromiso de liderar, mantener y mejorar el SGI, proporcionando los recursos necesarios y promoviendo una cultura de calidad, servicio y protección de la información en todos los niveles de la organización. Esta política deberá revisarse por lo menos una vez al año.","compromisos":["La Alta Dirección deberá liderar, mantener y mejorar de manera continua la eficacia del SGI, asumiendo la responsabilidad sobre su desempeño.","El SGI deberá mantenerse alineado con el contexto, la dirección estratégica y las necesidades y expectativas de las partes interesadas.","El SGI deberá contribuir al logro de los objetivos estratégicos y a la sostenibilidad de NTT DATA México a largo plazo.","Cumplir los requisitos legales, reglamentarios, contractuales y los estándares internos aplicables a la calidad, la gestión del servicio y la seguridad de la información.","Establecer, comunicar y revisar periódicamente objetivos medibles del SGI, dando seguimiento a su cumplimiento mediante indicadores.","Determinar, evaluar y tratar los riesgos y oportunidades que afecten la conformidad de los servicios, la continuidad de la operación y la protección de la información.","Proporcionar los recursos humanos, tecnológicos y financieros necesarios para operar, mantener y mejorar el SGI.","Comunicar, comprender y aplicar esta política en todos los niveles de la organización y mantenerla disponible para las partes interesadas.","Evaluar periódicamente el desempeño del SGI mediante auditorías internas, revisión por la Dirección y análisis de indicadores."],"compromisos_9001":["Orientar los procesos a la satisfacción del cliente, comprendiendo, cumpliendo y procurando superar sus requisitos y expectativas.","Gestionar los procesos bajo un enfoque basado en procesos y en el pensamiento basado en riesgos.","Asegurar la calidad y la trazabilidad de la cadena de valor, incluido el ciclo Quote to Cash, reduciendo reprocesos y tiempos de ciclo.","Identificar y atender las no conformidades mediante acciones correctivas que prevengan su recurrencia."],"compromisos_20000":["Diseñar, operar y mejorar los servicios de TI para cumplir los niveles de servicio (SLA) y los objetivos de disponibilidad acordados.","Gestionar incidentes, requerimientos y problemas de forma oportuna, con análisis de causa raíz para reducir impacto y recurrencia.","Gestionar los cambios en los servicios de manera controlada, evaluando riesgos e impactos antes de su implementación.","Generar valor mediante la mejora continua de los servicios y de la relación con clientes y proveedores."],"compromisos_27001":["Preservar la confidencialidad, la integridad y la disponibilidad de la información propia, de los clientes y de las partes interesadas.","Gestionar los riesgos de seguridad de la información y aplicar los controles determinados en la Declaración de Aplicabilidad (SoA).","Proporcionar concientización y capacitación en seguridad de la información acorde con el rol y las responsabilidades de cada persona.","Reportar, gestionar y documentar los eventos e incidentes de seguridad de la información para su contención, análisis y mejora.","Mantener planes de continuidad que aseguren la disponibilidad de los servicios y la información críticos ante interrupciones."],"alcance":{"sistema":"SGI · Integral","descripcion":"Aplica a la totalidad de los procesos, servicios, áreas, personal, proveedores y activos de información comprendidos dentro del alcance certificado del Sistema de Gestión Integral de NTT DATA México, y es de observancia obligatoria para todo el personal propio y para los terceros que participen en dichos procesos.","sitio":"Av. Paseo de la Reforma #505, piso 43, suite A · C.P. 06500, Cuauhtémoc, Ciudad de México","exclusiones":"ISO 9001 — 7.1.5.2 Trazabilidad de las mediciones · 8.2.5.3 Propiedad del cliente o proveedores externos. ISO 27001 — Controles tecnológicos 8.25, 8.27, 8.28, 8.29 y 8.30 (desarrollo seguro). ISO 20000-1 — Sin exclusiones."},"registros":[{"clave":"BPM-FO-19","nombre":"Objetivos del Sistema de Gestión Integral"}],"relacionados":[{"clave":"BPM-PR-02","nombre":"Procedimiento de Gestión de Cambios de TI"}],"control_cambios":[{"fecha":"06/2026","descripcion":"Emisión inicial del documento.","version":"01"},{"fecha":"07/2026","descripcion":"Se define periodicidad de revisión y rol de autorización del documento.","version":"01"}],"estado_aprobacion":"Pendiente de aprobación formal de la Alta Dirección — NC mayor INT-2026-NCM-04"}],"objetivos":[{"id":0,"num":1,"norma":"ISO 9001","tema":"Calidad de bookings (first-time-right) en Q2C","objetivo":"Mejorar la calidad a la primera (first-time-right) de los bookings del proceso Quote-to-Cash (Q2C), reduciendo la tasa de rechazos asociada a las causas principales identificadas.","meta":"Reducir la tasa de rechazo de bookings en al menos 20% respecto a la línea base, mediante el tratamiento de las tres causas que concentran aproximadamente el 75% de los rechazos.","indicador":"% de rechazo de bookings (rechazos / total de bookings) y % de reducción respecto a la línea base.","periodo":"2026 · S1 / S2","estado":"En ejecución","plan_s1":"−10% rechazos","plan_s2":"−20% rechazos","act_s1":"Confirmar la línea base y el análisis de Pareto de causas de rechazo; definir acciones correctivas para las tres causas principales.","act_s2":"Implementar controles preventivos (validaciones y checklist de booking) y dar seguimiento al cierre de las acciones correctivas.","resp_s1":"Líder de proceso Q2C / Calidad","resp_s2":"Líder de proceso Q2C","rec_s1":"Análisis de rechazos (Pareto), tablero de seguimiento","rec_s2":"Checklist/validaciones de booking, tablero Power BI Q2C","real_s1":"","real_s2":"","cumpl_s1":"","cumpl_s2":"","observaciones":"","proceso_20000":"","sla_vinculado":""},{"id":1,"num":2,"norma":"ISO 9001","tema":"Tiempo de ciclo del proceso Q2C","objetivo":"Reducir el tiempo de ciclo del proceso Q2C mejorando el flujo y los puntos de control entre cotización, booking, entrega y facturación.","meta":"Reducir el tiempo de ciclo promedio del Q2C en al menos 10% respecto a la línea base y mantener al menos el 90% de los casos dentro del tiempo objetivo.","indicador":"Tiempo de ciclo promedio (días) del Q2C y % de casos dentro del tiempo objetivo.","periodo":"2026 · S1 / S2","estado":"En ejecución","plan_s1":"−5% tiempo de ciclo","plan_s2":"−10% tiempo; ≥90% en tiempo objetivo","act_s1":"Mapear el tiempo de ciclo por etapa e identificar los cuellos de botella (iniciativa Calibrando Q2C).","act_s2":"Implementar mejoras en las etapas con mayor demora y medir el impacto sobre el tiempo de ciclo.","resp_s1":"Líder de proceso Q2C","resp_s2":"Líder de proceso Q2C / PMO","rec_s1":"Trazabilidad Q2C, mapeo de proceso (BPMN)","rec_s2":"Tablero de tiempos, plan de mejoras","real_s1":"","real_s2":"","cumpl_s1":"","cumpl_s2":"","observaciones":"","proceso_20000":"","sla_vinculado":""},{"id":2,"num":3,"norma":"ISO 9001","tema":"Exactitud de facturación en el cierre del Q2C","objetivo":"Mejorar la calidad del cierre del proceso Q2C reduciendo los errores de facturación y las notas de crédito derivadas de inconsistencias del proceso.","meta":"Alcanzar una exactitud de facturación mayor o igual al 98% y reducir las notas de crédito por error en al menos 25% respecto a la línea base.","indicador":"% de exactitud de facturación (facturas correctas / total) y número/% de notas de crédito por error.","periodo":"2026 · S1 / S2","estado":"En ejecución","plan_s1":"≥97% exactitud; −15% notas de crédito","plan_s2":"≥98% exactitud; −25% notas de crédito","act_s1":"Conciliar la información entre fuentes (Salesforce, SAP/ICS, Logística y RPT) y clasificar las causas de las notas de crédito.","act_s2":"Implementar validaciones previas a la facturación y dar seguimiento a la reducción de errores.","resp_s1":"Líder de proceso Q2C / Facturación","resp_s2":"Facturación / Calidad","rec_s1":"Trazabilidad Q2C end-to-end, conciliación de fuentes","rec_s2":"Controles de validación, tablero Power BI Q2C","real_s1":"","real_s2":"","cumpl_s1":"","cumpl_s2":"","observaciones":"","proceso_20000":"","sla_vinculado":""},{"id":3,"num":4,"norma":"ISO 27001","tema":"Gestión y respuesta a incidentes de seguridad","objetivo":"Fortalecer la capacidad de respuesta del SOC reduciendo el tiempo medio de contención (MTTR) de los incidentes de seguridad de la información clasificados como críticos y altos.","meta":"Atender el 100% de los incidentes críticos dentro del SLA acordado y reducir el MTTR de incidentes críticos en al menos 15% respecto a la línea base del semestre previo.","indicador":"% de incidentes críticos atendidos dentro de SLA y MTTR promedio (horas) de incidentes críticos.","periodo":"2026 · S1 / S2","estado":"En ejecución","plan_s1":"≥95% en SLA","plan_s2":"100% en SLA; −15% MTTR","act_s1":"Establecer y publicar la línea base de MTTR; formalizar la matriz de clasificación, priorización y escalamiento de incidentes; habilitar tablero de seguimiento de incidentes de seguridad.","act_s2":"Elaborar/actualizar runbooks y playbooks de los incidentes más frecuentes; ejecutar ejercicios de simulación (tabletop) y registrar lecciones aprendidas.","resp_s1":"Líder SOC","resp_s2":"Líder SOC / Analista de seguridad senior","rec_s1":"SIEM, herramienta de ticketing/ITSM, analistas N1/N2","rec_s2":"Playbooks, plataforma SOAR (si está disponible), analistas N2","real_s1":"","real_s2":"","cumpl_s1":"","cumpl_s2":"","observaciones":"","proceso_20000":"","sla_vinculado":""},{"id":4,"num":5,"norma":"ISO 27001","tema":"Gestión de vulnerabilidades","objetivo":"Establecer y operar un ciclo periódico de identificación, priorización y remediación de vulnerabilidades sobre los activos críticos bajo monitoreo del SOC.","meta":"Lograr cobertura de escaneo del 100% de los activos críticos y remediar al menos el 85% de las vulnerabilidades críticas y altas dentro del plazo definido (30 días críticas / 60 días altas).","indicador":"% de cobertura de escaneo de activos críticos y % de vulnerabilidades críticas/altas remediadas dentro de plazo.","periodo":"2026 · S1 / S2","estado":"En ejecución","plan_s1":"Cobertura 100%; ≥75% remediado en plazo","plan_s2":"≥85% remediado en plazo","act_s1":"Inventariar los activos críticos y calendarizar escaneos periódicos; acordar los SLA de remediación con las áreas dueñas de los activos.","act_s2":"Implementar reporte mensual de remediación y reuniones de seguimiento con las áreas responsables para asegurar el cierre dentro de plazo.","resp_s1":"Analista de gestión de vulnerabilidades / Líder SOC","resp_s2":"Líder SOC","rec_s1":"Herramienta de escaneo de vulnerabilidades, inventario de activos/CMDB","rec_s2":"Tablero de métricas de remediación","real_s1":"","real_s2":"","cumpl_s1":"","cumpl_s2":"","observaciones":"","proceso_20000":"","sla_vinculado":""},{"id":5,"num":6,"norma":"ISO 27001","tema":"Madurez de monitoreo y detección","objetivo":"Incrementar la madurez de detección del SOC ampliando la cobertura de casos de uso (use cases) de monitoreo alineados a los escenarios de amenaza relevantes para la organización.","meta":"Incrementar en al menos 20% el número de casos de uso de detección operativos respecto a la línea base y reducir la tasa de falsos positivos de las alertas priorizadas en al menos 10%.","indicador":"Número y % de casos de uso de detección operativos, y % de falsos positivos en alertas priorizadas.","periodo":"2026 · S1 / S2","estado":"En ejecución","plan_s1":"+10% casos de uso","plan_s2":"+20% casos de uso; −10% falsos positivos","act_s1":"Mapear los casos de uso actuales contra un marco de referencia (p. ej. MITRE ATT&CK) e identificar y priorizar las brechas de cobertura.","act_s2":"Implementar los casos de uso priorizados y afinar reglas de correlación para reducir falsos positivos; documentar los nuevos casos de uso.","resp_s1":"Ingeniero de detección / Líder SOC","resp_s2":"Ingeniero de detección","rec_s1":"SIEM, matriz de cobertura, marco MITRE ATT&CK","rec_s2":"SIEM, fuentes de log adicionales","real_s1":"","real_s2":"","cumpl_s1":"","cumpl_s2":"","observaciones":"","proceso_20000":"","sla_vinculado":""},{"id":6,"num":7,"norma":"ISO 20000-1","tema":"Disponibilidad y niveles de servicio del NOC","objetivo":"Asegurar y mejorar la disponibilidad de los servicios de TI gestionados por el NOC conforme a los niveles de servicio acordados.","meta":"Mantener una disponibilidad mayor o igual a 99.5% de los servicios críticos monitoreados y cumplir al menos el 95% de los SLA comprometidos.","indicador":"% de disponibilidad de servicios críticos y % de cumplimiento de SLA.","periodo":"2026 · S1 / S2","estado":"En ejecución","plan_s1":"≥99.0%","plan_s2":"≥99.5%","act_s1":"Definir y validar el catálogo de servicios críticos con sus SLA; configurar monitoreo, umbrales y alertamiento de disponibilidad.","act_s2":"Implementar el report
